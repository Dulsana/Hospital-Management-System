# Server Port
server.port=8080

# Spring Application Name
spring.application.name=medicare-hms

# Database Configuration (XAMPP MariaDB/MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/medicare_hms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate manages the schema; the bundled MySQL seed scripts can also be
# imported through XAMPP/phpMyAdmin when needed.
spring.sql.init.mode=never

# CORS & Logging Configuration
logging.level.org.springframework.web=INFO

# The HTML/CSS/JS source is kept at the workspace root. These locations let
# IntelliJ's direct Spring Boot run serve it as well as the packaged JAR.
# The project folder comes FIRST so the server always sends the current files,
# never an old copy left in backend/target from an earlier build.
spring.web.resources.static-locations=file:${user.dir}/,file:${user.dir}/../,classpath:/static/

# Make the browser re-check CSS/JS on every load, so changes show without clearing its cache
spring.web.resources.cache.cachecontrol.no-cache=true
