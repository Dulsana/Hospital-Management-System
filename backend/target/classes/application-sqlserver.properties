# Microsoft SQL Server (SSMS) profile
# Start with: mvn spring-boot:run "-Dspring-boot.run.profiles=sqlserver"
# Or set SPRING_PROFILES_ACTIVE=sqlserver in the IntelliJ run configuration.
#
# Local SSMS is running as the SQLEXPRESS named instance.
# If you use another instance, replace localhost\\SQLEXPRESS with its server name.
spring.datasource.url=${SQLSERVER_URL:jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=hospital_management;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SQLSERVER_USERNAME:sa}
spring.datasource.password=${SQLSERVER_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Existing JPA entities create/update their matching SQL Server tables automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
